plugins { id 'com.android.application' }

android {
    namespace 'ar.tecnomanu.heladera'
    compileSdk 35

    defaultConfig {
        applicationId "ar.tecnomanu.heladera"
        // La tablet de la heladera es una SM-T350 (Android 5.1), por eso 21.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
